# 32GB tier: dense model (no MoE experts to offload), so all ~15.3GiB of weights sit on
# the GPU. KV cache: 16 of 64 layers are full attention, 4 KV heads x 256 dims, f16
# -> ~64KiB per token, i.e. 8GiB at 131,072 tokens (~25-26GiB on GPU in total).
# ~196k is the most a 32GB card can hold and is tight; 500k+ does not fit.
# KV figures are calculated, not measured on hardware.
