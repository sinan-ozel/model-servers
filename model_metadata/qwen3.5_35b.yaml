name: qwen3.5
tag: 35b
model_type: instruct
# Hybrid tier: all 40 layers are MoE-equipped (256 experts, 9 active ≈ 3B params/token).
# --n-cpu-moe offloads MoE expert tensors to CPU RAM, keeping attention + mmproj +
# KV cache on GPU — that residual is small relative to the 22GiB total, so a 12GB
# card is the working assumption here (unconfirmed on real hardware; if actual
# non-expert weight + KV cache overflows 12GB, drop to a smaller GPU tier).
# min/recommended below are system RAM for the CPU-resident experts.
vram_tier: 12g-ram32g
memory:
  model_size: 22GiB
  min: 32GiB
  recommended: 48GiB
license: Apache 2.0
max_context_window: 256k
gguf:
  url: https://huggingface.co/unsloth/Qwen3.5-35B-A3B-GGUF/resolve/main/Qwen3.5-35B-A3B-Q4_K_M.gguf
  filename: Qwen3.5-35B-A3B-Q4_K_M.gguf
  file_size: 22GiB
  mmproj:
    url: https://huggingface.co/unsloth/Qwen3.5-35B-A3B-GGUF/resolve/main/mmproj-BF16.gguf
    filename: Qwen3.5-35B-A3B-mmproj-BF16.gguf
    file_size: 903MiB
llamacpp_args: "-ngl 999 --n-cpu-moe 40 -c 32768"
