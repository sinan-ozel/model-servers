name: qwen3.5
tag: 27b
model_type: instruct
# 32GB tier: dense model (no MoE experts to offload), so all ~16.5GiB (incl. mmproj) of weights sit on
# the GPU. KV cache: 16 of 64 layers are full attention, 4 KV heads x 256 dims, f16
# -> ~64KiB per token, i.e. 8GiB at 131,072 tokens (~25-26GiB on GPU in total).
# ~196k is the most a 32GB card can hold and is tight; 500k+ does not fit.
# KV figures are calculated, not measured on hardware.
vram_tier: 32g
memory:
  model_size: 15.6GiB
  min: 24GiB
  recommended: 32GiB
license: Apache 2.0
max_context_window: 256k
gguf:
  # Actual repo file is "Q4_E_H" (not "Q4_K_H") and mmproj has no ".BF16" in its
  # name (verified against HF file listing).
  url: https://huggingface.co/steampunque/Qwen3.5-27B-MP-GGUF/resolve/main/Qwen3.5-27B.Q4_E_H.gguf
  filename: Qwen3.5-27B.Q4_E_H.gguf
  file_size: 15.6GiB
  mmproj:
    url: https://huggingface.co/steampunque/Qwen3.5-27B-MP-GGUF/resolve/main/Qwen3.5-27B.mmproj.gguf
    filename: Qwen3.5-27B.mmproj.gguf
    file_size: 885MiB
llamacpp_args: "-ngl 999 -c 131072"
