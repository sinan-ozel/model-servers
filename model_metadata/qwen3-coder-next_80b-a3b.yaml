name: qwen3-coder-next
tag: 80b-a3b
model_type: instruct
# Hybrid tier: quant doesn't fit in VRAM alone (48.5GiB weights, only 3B params
# active per token). --n-cpu-moe offloads all 48 MoE expert layers to CPU RAM,
# keeping attention/shared tensors + KV cache on GPU — that residual is small
# relative to the 48.5GiB total, so a 12GB card is the working assumption here
# (unconfirmed on real hardware; if actual non-expert weight + KV cache overflows
# 12GB, bump to a larger GPU tier, e.g. 24g-ram64g).
vram_tier: 12g-ram64g
memory:
  model_size: 48.5GiB
  min: 56GiB
  recommended: 64GiB
license: Apache 2.0
max_context_window: 256k
gguf:
  url: https://huggingface.co/unsloth/Qwen3-Coder-Next-GGUF/resolve/main/Qwen3-Coder-Next-Q4_K_M.gguf
  filename: Qwen3-Coder-Next-Q4_K_M.gguf
  file_size: 48.5GiB
llamacpp_args: "-ngl 999 --n-cpu-moe 48 -c 32768"
